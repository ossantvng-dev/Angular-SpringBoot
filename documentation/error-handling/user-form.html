<form (ngSubmit)="onSubmit(userForm)" #userForm="ngForm">
  <div>
    <input placeholder="Name" name="name" [(ngModel)]="user.name" class="form-control my-2" />
    <div class="text-danger" *ngIf="formErrors['name']">{{ formErrors['name'] }}</div>
  </div>

  <div>
    <input placeholder="Lastname" name="lastname" [(ngModel)]="user.lastName" class="form-control my-2" />
    <div class="text-danger" *ngIf="formErrors['lastName']">{{ formErrors['lastName'] }}</div>
  </div>

  <div>
    <input placeholder="Email" name="email" [(ngModel)]="user.email" class="form-control my-2" />
    <div class="text-danger" *ngIf="formErrors['email']">{{ formErrors['email'] }}</div>
  </div>

  <div>
    <input placeholder="Username" name="username" [(ngModel)]="user.username" class="form-control my-2" />
    <div class="text-danger" *ngIf="formErrors['username']">{{ formErrors['username'] }}</div>
  </div>

  <div>
    <input placeholder="Password" name="password" type="password" [(ngModel)]="user.password" class="form-control my-2" />
    <div class="text-danger" *ngIf="formErrors['password']">{{ formErrors['password'] }}</div>
  </div>

  <div>
    <button type="submit" class="btn btn-primary my-2">
      {{ user.id > 0 ? 'Update' : 'Create' }}
    </button>
    <button type="button" class="btn btn-secondary my-2 ms-2" (click)="onClear(userForm)">
      Clear
    </button>
  </div>
</form>
