micronaut.application.name=micronaut-user-app-api

# ---------------------------------------------------------------------------
# Persistence (environment-independent parts only - see application-dev/prod
# for the URL and credentials)
# ---------------------------------------------------------------------------
datasources.default.db-type=mysql
datasources.default.dialect=MYSQL
datasources.default.driver-class-name=com.mysql.cj.jdbc.Driver

jpa.default.entity-scan.packages=com.users.entity
jpa.default.properties.hibernate.hbm2ddl.auto=none

flyway.datasources.default.enabled=true
flyway.datasources.default.baseline-on-migrate=true

# Pageable binding.
# The 'page' and 'size' parameter names are already Micronaut's defaults and match
# what the Angular UserService sends; only the fallback size differs from Spring's 20.
micronaut.data.pageable.default-page-size=20

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
micronaut.security.authentication=bearer
micronaut.security.enabled=true

# Hardcoded on purpose - this is a learning project (decision 4 in design-plan.md).
micronaut.security.token.jwt.signatures.secret.generator.secret=MyVerySecretJWTKeyForMicronautApplication2026

# 900s = 15 min, matching the Spring app's jwt.expiration=900000 (ms).
# Without this, Micronaut would default to 3600s.
micronaut.security.token.generator.access-token.expiration=900

# Fail-closed backstop.
# Micronaut ALLOWS a request when every security rule returns UNKNOWN, so an
# endpoint that is simply missing a @Secured annotation would be public. This
# catch-all denies anonymous access to anything not explicitly opened up, and
# mirrors Spring's .anyRequest().authenticated().
#
# Per-route authorization lives in @Secured on the controllers: SecuredAnnotationRule
# (order -200) is evaluated before ConfigurationInterceptUrlMapRule (order -100),
# so the annotations always take precedence over this backstop.
micronaut.security.intercept-url-map[0].pattern=/**
micronaut.security.intercept-url-map[0].access[0]=isAuthenticated()

# ---------------------------------------------------------------------------
# CORS - mirrors SecurityConfiguration.corsConfigurationSource() in the Spring app.
# Allowed origins are environment-specific (see application-dev/prod).
#
# Do NOT add `allowed-headers[0]=*` here as a translation of Spring's
# setAllowedHeaders(List.of("*")). Micronaut already allows any header by default,
# and setting a literal "*" turns it into an explicit one-item allow-list that every
# preflight then fails - CorsFilter answers OPTIONS with a bodyless 403 and logs
# nothing. Omitting the property is the equivalent of Spring's "*".
# ---------------------------------------------------------------------------
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-methods[0]=GET
micronaut.server.cors.configurations.web.allowed-methods[1]=POST
micronaut.server.cors.configurations.web.allowed-methods[2]=PUT
micronaut.server.cors.configurations.web.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.web.allowed-methods[4]=OPTIONS
micronaut.server.cors.configurations.web.allow-credentials=true
