# Mirrors the Spring app's application-dev.properties.
# Active by default - see Application.defaultEnvironments(Environment.DEVELOPMENT).

# ---------------------------------------------------------------------------
# Datasource
# Shares `usersdb` with the Spring app (decision 3): the two APIs are not meant
# to run at the same time, and the Spring app reseeds via data.sql on every boot.
# ---------------------------------------------------------------------------
datasources.default.url=jdbc:mysql://localhost:3306/usersdb?allowPublicKeyRetrieval=true&useSSL=false
datasources.default.username=usersdb_user
datasources.default.password=password

jpa.default.properties.hibernate.show_sql=true
jpa.default.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Redis (refresh token store)
# ---------------------------------------------------------------------------
redis.uri=redis://localhost:6379

# ---------------------------------------------------------------------------
# CORS - the Angular dev server
# ---------------------------------------------------------------------------
micronaut.server.cors.configurations.web.allowed-origins[0]=http://localhost:4200

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logger.levels.org.hibernate.SQL=DEBUG
logger.levels.org.hibernate.orm.jdbc.bind=TRACE
