# Mirrors the Spring app's application-prod.properties.
# Activate with: MICRONAUT_ENVIRONMENTS=prod  (or -Dmicronaut.environments=prod)

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
datasources.default.url=${DB_URL}
datasources.default.username=${DB_USERNAME}
datasources.default.password=${DB_PASSWORD}

jpa.default.properties.hibernate.show_sql=false

# ---------------------------------------------------------------------------
# Redis (refresh token store)
# ---------------------------------------------------------------------------
redis.uri=redis://${REDIS_HOST}:${REDIS_PORT}

# ---------------------------------------------------------------------------
# CORS
#
# Ported as-is from the Spring app, which used allowedOriginPatterns("*") together
# with allowCredentials(true) - i.e. it reflects whatever Origin the caller sends.
# `allowed-origins-regex` is the Micronaut equivalent (a literal "*" is not valid
# alongside credentials). This is permissive and inherited, not a new decision -
# flagged in design-plan.md as worth tightening to real origins before any real
# deployment.
# ---------------------------------------------------------------------------
micronaut.server.cors.configurations.web.allowed-origins-regex=.*

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logger.levels.ROOT=INFO
