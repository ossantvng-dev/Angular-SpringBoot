@if (isAuthenticated$ | async) {
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Users App</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" [routerLink]="['/users']">Home</a>
          </li>
          @if (isAdmin$ | async) {
            <li class="nav-item">
              <a class="nav-link" [routerLink]="['/users/create']"> New User </a>
            </li>
          }
        </ul>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <span class="navbar-text"> Welcome {{ username$ | async }} </span>
          <button class="btn btn-outline-danger" (click)="logout()" [disabled]="loading$ | async">
            @if (loading$ | async) {
              <app-spinner></app-spinner> Logging out...
            } @else {
              Logout
            }
          </button>
        </div>
      </div>
    </div>
  </nav>
}
